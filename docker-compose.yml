# Local development dependencies only — production uses Azure services.
services:
  postgres:
    image: postgres:16-alpine
    container_name: maxwellau-postgres
    environment:
      POSTGRES_USER: maxwellau
      POSTGRES_PASSWORD: localdev # local-only credential, never used in Azure
      POSTGRES_DB: maxwellau_dev
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U maxwellau -d maxwellau_dev"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Azure Storage emulator for Blob/Queue development (Phase 4/5).
  azurite:
    image: mcr.microsoft.com/azure-storage/azurite
    container_name: maxwellau-azurite
    command: azurite --blobHost 0.0.0.0 --queueHost 0.0.0.0 --silent --skipApiVersionCheck
    ports:
      - "10000:10000" # blob
      - "10001:10001" # queue

volumes:
  postgres-data:
